<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="50%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#E85D04" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF2D6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="32" cy="33" r="30" fill="#201509" opacity="0.25" />
  
  <!-- Outer Dark Border -->
  <circle cx="32" cy="32" r="30" fill="#1C160C" />

  <!-- Inner Badge Circle -->
  <circle cx="32" cy="32" r="26" fill="url(#bgGrad)" />

  <!-- Highlight Arc -->
  <path d="M 12 28 A 24 24 0 0 1 52 28" stroke="#FFE29A" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Glowing Lightning Zap -->
  <path d="M35 12 L19 33 H32 L27 52 L45 29 H32 Z" fill="#000000" opacity="0.25" transform="translate(1, 2)" />
  <path d="M34 13 L20 33 H33 L28 51 L44 29 H31 Z" fill="url(#boltGrad)" stroke="#1C160C" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)" />
</svg>
