apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusai-config
  namespace: nexusai
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres-service:5432/nexusai"
  REDIS_URL: "redis://redis-service:6379/0"
  QDRANT_URL: "http://qdrant-service:6333"
  SANDBOX_STORAGE_DIR: "/app/sandbox_workspaces"
  MEDIA_STORAGE_DIR: "/app/media_storage"
  DOCUMENT_STORAGE_DIR: "/app/document_storage"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexusai-secrets
  namespace: nexusai
type: Opaque
stringData:
  SECRET_KEY: "nexus_super_secret_jwt_k8s_production_token_key"
  OPENAI_API_KEY: "sk-proj-placeholder"
  ANTHROPIC_API_KEY: "sk-ant-placeholder"
  GEMINI_API_KEY: "AIzaSy-placeholder"
  FAL_KEY: "fal-placeholder"
  TAVILY_API_KEY: "tvly-placeholder"
