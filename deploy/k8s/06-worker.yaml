apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-worker
  namespace: nexusai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusai-worker
  template:
    metadata:
      labels:
        app: nexusai-worker
    spec:
      containers:
      - name: worker
        image: nexusai/backend:latest
        command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "-c", "4"]
        envFrom:
        - configMapRef:
            name: nexusai-config
        - secretRef:
            name: nexusai-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
