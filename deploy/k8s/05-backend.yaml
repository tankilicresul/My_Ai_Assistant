apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-backend
  namespace: nexusai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexusai-backend
  template:
    metadata:
      labels:
        app: nexusai-backend
    spec:
      containers:
      - name: backend
        image: nexusai/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: nexusai-config
        - secretRef:
            name: nexusai-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: nexusai
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: nexusai-backend
