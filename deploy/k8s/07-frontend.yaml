apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-frontend
  namespace: nexusai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusai-frontend
  template:
    metadata:
      labels:
        app: nexusai-frontend
    spec:
      containers:
      - name: frontend
        image: nexusai/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "/api/v1"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: nexusai
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: nexusai-frontend
